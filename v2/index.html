<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excellence program — Supplier Portal concept</title>
  <!-- Round 2 does not load defect-cards.css: the breakdown is a PrimeVue
       Accordion (2423:103908), not the DBR portal's category layout. That
       stylesheet's :root fallbacks would clobber tokens.css anyway, which is
       why round 1 had to order them. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/round2.css">
  <script>try{if(sessionStorage.getItem('sxp-auth')==='1')document.documentElement.className+=' authed';}catch(e){}</script>
</head>
<body>

  <!-- ===================== PASSWORD GATE (cosmetic — see js/auth-gate.js) =====================
       Outside the Vue app on purpose: it gates the whole document, runs before
       any data is fetched, and has no reason to wait for the app to mount. -->
  <div id="auth-gate" class="auth-gate">
    <form class="auth-gate__card" id="auth-form">
      <img src="assets/logo-gyg.svg" alt="GetYourGuide" class="auth-gate__logo">
      <h1 class="auth-gate__title">Protected preview</h1>
      <p class="auth-gate__desc">Enter the password to view this prototype.</p>
      <input type="password" id="auth-input" class="auth-gate__input" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button type="submit" class="auth-gate__btn">Enter</button>
      <p class="auth-gate__error hidden" id="auth-error">Incorrect password. Try again.</p>
    </form>
  </div>

  <!-- Top nav, sidebar, page and help button are all rendered by AppShell. -->
  <div id="app"></div>

  <!-- Vendored browser builds, not a CDN: round-2 links go to real suppliers
       and a CDN stall would blank the page. See js/primevue-setup.js. -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/primevue.min.js"></script>
  <script src="vendor/primeuix-lara.js"></script>

  <script src="js/interactions.js"></script>
  <script src="js/criteria-model.js"></script>
  <script type="module" src="js/app-overview.js"></script>
  <script src="js/auth-gate.js"></script>
</body>
</html>
